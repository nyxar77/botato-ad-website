<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Botato — Ad spots in my videos</title>
    <meta name="description" content="Put your page, shop or message on the screens behind me in my videos. TV screen, big screen, or both." />
    <meta name="theme-color" content="#0d0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="Botato — Ad spots in my videos" />
    <meta property="og:description" content="Your ad on the screens behind me, for the whole video." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="image" href="/studio.webp" type="image/webp" fetchpriority="high" />
    <script>
      // Runs before paint: apply saved/system theme + language direction to avoid a flash.
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('botato:theme');
          var dark = t ? t === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
          d.classList.toggle('dark', dark);
          var l = localStorage.getItem('botato:lang');
          if (!l) {
            var langs = navigator.languages || [navigator.language || 'en'];
            for (var i = 0; i < langs.length; i++) {
              var b = String(langs[i]).toLowerCase().split('-')[0];
              if (b === 'ar' || b === 'fr' || b === 'en') { l = b; break; }
            }
          }
          l = l || 'en';
          d.lang = l;
          d.dir = l === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
