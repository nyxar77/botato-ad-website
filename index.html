<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>إعلانك في فيديوهاتي</title>
    <meta name="description" content="احجز مساحتك الإعلانية على الشاشات التي تظهر في فيديوهاتي." />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d12" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="إعلانك في فيديوهاتي" />
    <meta property="og:description" content="إعلانك على الشاشات خلفي طوال مدة الفيديو." />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" as="image" href="/studio.webp" type="image/webp" fetchpriority="high" />
    <script>
      // Unregister any leftover localhost service workers from other projects (e.g. pulse)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        });
      }
      // Respect user/browser preferences if available, otherwise fall back to Arabic + Light Mode.
      (function () {
        try {
          var d = document.documentElement;
          var t = localStorage.getItem('botato:theme');
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          d.classList.toggle('dark', dark);

          var l = localStorage.getItem('botato:lang');
          if (!l) {
            var langs = navigator.languages || [navigator.language || 'ar'];
            for (var i = 0; i < langs.length; i++) {
              var b = String(langs[i]).toLowerCase().split('-')[0];
              if (b === 'ar' || b === 'fr' || b === 'en') {
                l = b;
                break;
              }
            }
          }
          l = l || 'ar';
          d.lang = l;
          d.dir = l === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
